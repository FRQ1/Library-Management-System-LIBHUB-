<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="spineHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Cover Body -->
  <rect width="400" height="600" rx="16" fill="url(#bookBg)"/>
  
  <!-- Subtle Spine Crease -->
  <rect x="0" y="0" width="36" height="600" rx="16" fill="url(#spineHighlight)"/>
  <line x1="36" y1="0" x2="36" y2="600" stroke="#334155" stroke-width="1.5"/>

  <!-- Ornate Decorative Frame -->
  <rect x="56" y="48" width="288" height="504" rx="8" stroke="url(#goldAccent)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <rect x="64" y="56" width="272" height="488" rx="6" stroke="#475569" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Center Emblem -->
  <circle cx="200" cy="240" r="48" fill="#1E293B" stroke="url(#goldAccent)" stroke-width="2"/>
  <path d="M182 248V228C182 225.791 183.791 224 186 224H200M218 248V228C218 225.791 216.209 224 214 224H200M200 224V252M182 248C188 246 195 248 200 252M218 248C212 246 205 248 200 252" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Typography -->
  <text x="200" y="340" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.05em">LIBHUB COLLECTION</text>
  <line x1="140" y1="360" x2="260" y2="360" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>
  <text x="200" y="390" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Classic &amp; Modern Library</text>

  <!-- Bottom Crest -->
  <text x="200" y="515" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.1em">OFFICIAL EDITION</text>
</svg>
