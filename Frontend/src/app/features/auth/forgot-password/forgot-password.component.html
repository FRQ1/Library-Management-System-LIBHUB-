<div class="auth-page">
  <div class="auth-branding">
    <div class="auth-branding-content">
      <div class="crest crest-lg">
        <app-icon name="library" [size]="28" [strokeWidth]="2"></app-icon>
      </div>
      <h1 class="brand-title">LibHub</h1>
      <p class="brand-tagline">Forgotten passwords happen. We'll help you get back in.</p>
    </div>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Forgot your password?</h2>
      <p>Enter your email and we'll send you a reset token (check the server console in dev).</p>

      @if (message) {
        <div class="alert" [class.alert-danger]="isError" [class.alert-success]="!isError">
          <app-icon [name]="isError ? 'alert-circle' : 'check-circle'" [size]="16"></app-icon>
          {{ message }}
        </div>
      }

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-1" [disabled]="loading">
        <app-icon name="check" [size]="16"></app-icon>
        {{ loading ? 'Sending...' : 'Send reset token' }}
      </button>

      <p class="auth-footer">
        <a routerLink="/reset-password">I already have a token</a> &middot;
        <a routerLink="/login">Back to login</a>
      </p>
    </form>
  </div>
</div>
