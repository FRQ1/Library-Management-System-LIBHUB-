<div class="auth-page">
  <div class="auth-branding">
    <div class="auth-branding-content">
      <div class="crest crest-lg">
        <app-icon name="library" [size]="28" [strokeWidth]="2"></app-icon>
      </div>
      <h1 class="brand-title">LibHub</h1>
      <p class="brand-tagline">Almost there - let's confirm your email.</p>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Email Verification</h2>

      @if (loading) {
        <div class="spinner"></div>
      } @else {
        <div class="alert" [class.alert-success]="success" [class.alert-danger]="!success">
          <app-icon [name]="success ? 'check-circle' : 'alert-circle'" [size]="16"></app-icon>
          {{ message }}
        </div>
        <a routerLink="/login" class="btn btn-primary btn-block mt-1">
          <app-icon name="log-in" [size]="16"></app-icon> Go to login
        </a>
      }
    </div>
  </div>
</div>
