<div class="auth-page">
  <div class="auth-branding">
    <div class="auth-branding-content">
      <div class="crest crest-lg">
        <app-icon name="library" [size]="28" [strokeWidth]="2"></app-icon>
      </div>
      <h1 class="brand-title">LibHub</h1>
      <p class="brand-tagline">Choose a new password to get back into your account.</p>
    </div>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Reset your password</h2>
      <p>Paste the token from your email (or the server console) and choose a new password.</p>

      @if (message) {
        <div class="alert" [class.alert-danger]="isError" [class.alert-success]="!isError">
          <app-icon [name]="isError ? 'alert-circle' : 'check-circle'" [size]="16"></app-icon>
          {{ message }}
        </div>
      }

      <div class="form-group">
        <label for="token">Reset token</label>
        <input id="token" type="text" class="form-control" formControlName="token" placeholder="Paste your token here" />
      </div>

      <div class="form-group">
        <label for="password">New password</label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="At least 8 characters" />
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-1" [disabled]="loading">
        <app-icon name="check" [size]="16"></app-icon>
        {{ loading ? 'Resetting...' : 'Reset password' }}
      </button>

      <p class="auth-footer">
        <a routerLink="/login">Back to login</a>
      </p>
    </form>
  </div>
</div>
